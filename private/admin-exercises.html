<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuD Code Tester - Exercise Management</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
        padding: 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 2.5em;
        font-weight: 700;
        margin-bottom: 10px;
        color: #f8fafc;
      }
      .nav-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
      }
      .nav-buttons a,
      .nav-buttons button {
        padding: 10px 20px;
        background: #4c51bf;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        display: inline-block;
        line-height: 1.5;
      }
      .nav-buttons a:hover,
      .nav-buttons button:hover {
        background: #5a67d8;
      }
      .logout-btn {
        background: #e53e3e !important;
      }
      .logout-btn:hover {
        background: #c53030 !important;
      }
      .exercises-table {
        width: 100%;
        background: #1e293b;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead {
        background: #334155;
      }
      th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        color: #f8fafc;
        border-bottom: 2px solid #4a5568;
      }
      td {
        padding: 15px;
        border-bottom: 1px solid #334155;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #2d3748;
      }
      .exercise-name {
        font-weight: 600;
        color: #60a5fa;
      }
      .deadline-input {
        padding: 8px 12px;
        background: #0f172a;
        border: 2px solid #4a5568;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 14px;
        width: 100%;
        max-width: 250px;
      }
      .deadline-input:focus {
        outline: none;
        border-color: #4c51bf;
      }
      .save-btn {
        padding: 8px 16px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        margin-left: 10px;
      }
      .save-btn:hover {
        background: #059669;
      }
      .save-btn:disabled {
        background: #6b7280;
        cursor: not-allowed;
      }
      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-active {
        background: #065f46;
        color: #6ee7b7;
      }
      .status-past {
        background: #7c2d12;
        color: #fca5a5;
      }
      .status-upcoming {
        background: #1e3a8a;
        color: #93c5fd;
      }
      .message {
        padding: 12px 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }
      .message.success {
        background: #065f46;
        color: #6ee7b7;
        border: 1px solid #10b981;
      }
      .message.error {
        background: #7c2d12;
        color: #fca5a5;
        border: 1px solid #ef4444;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Exercise Management</h1>
        <p>Manage exercise deadlines and settings</p>
      </header>

      <div class="nav-buttons">
        <a href="/admin/logs">📊 View Logs</a>
        <form method="POST" action="/admin/logout" style="display: inline">
          <button type="submit" class="logout-btn">🚪 Logout</button>
        </form>
      </div>

      <div id="message" class="message"></div>
      <div id="loading" class="loading">Loading exercises...</div>

      <div id="exercisesContainer" style="display: none">
        <div class="exercises-table">
          <table>
            <thead>
              <tr>
                <th>Exercise</th>
                <th>Status</th>
                <th>Current Deadline</th>
                <th>Has Tests</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="exercisesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/admin-exercises.js"></script>
  </body>
</html>
