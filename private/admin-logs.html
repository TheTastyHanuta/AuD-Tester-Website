<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuD Code Tester - Logs</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      /* Full-width page wrapper, left-aligned content */
      .logs-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 24px;
        height: 100%;
        min-height: 0;
      }
      .logs-header {
        text-align: center;
        margin-bottom: 16px;
        color: #f8fafc;
      }
      .logs-header h1 {
        font-size: 2em;
        font-weight: 700;
        margin-bottom: 6px;
      }
      /* Main area fills remaining height; inner layout handles its own scrolls */
      .logs-main {
        flex: 1;
        min-height: 0;
        background: #2d3748;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        display: flex;
      }
      .logs-layout {
        display: flex;
        gap: 16px;
        width: 100%;
        min-height: 0;
      }
      .sidebar {
        width: 320px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .panel {
        background: #1a202c;
        border: 1px solid #4a5568;
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0; /* critical for nested flex scrolling areas */
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .toolbar select {
        padding: 8px 10px;
        border: 2px solid #4a5568;
        border-radius: 8px;
        background: #1a202c;
        color: #e2e8f0;
      }
      .toolbar button {
        padding: 8px 12px;
        background: linear-gradient(135deg, #4c51bf 0%, #553c9a 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .file-count {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        font-size: 0.75rem;
        background: #2b6cb0;
        color: #fff;
        border: 1px solid #2c5282;
      }
      .file-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #cbd5e1;
      }
      .file-item:hover {
        border-color: #4c51bf;
      }
      .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        color: #e2e8f0;
      }
      .file-actions {
        display: flex;
        gap: 6px;
      }
      .file-actions button {
        padding: 4px 8px;
        background: #2b6cb0;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      .log-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .log-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .current-file {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        background: #1a202c;
        border: 1px solid #4a5568;
        color: #cbd5e1;
      }
      .log-output {
        white-space: pre-wrap;
        background: #0b1020;
        color: #e3f2fd;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        line-height: 1.35;
        flex: 1;
        border: 1px solid #334155;
        min-height: 0;
      }
      .logout-btn {
        width: auto;
        padding: 8px 12px;
        background: linear-gradient(135deg, #4c51bf 0%, #553c9a 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      footer {
        text-align: center;
        margin-top: 16px;
        color: #cbd5e1;
        opacity: 0.8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="logs-wrapper">
      <header class="logs-header">
        <h1>AuD Logs</h1>
        <p>Live-Ansicht und Archiv der Server-Logs</p>
      </header>
      <main class="logs-main">
        <div class="logs-layout">
          <aside class="sidebar">
            <div class="panel">
              <div class="toolbar">
                <label for="logType">Typ:</label>
                <select id="logType">
                  <option value="app">App</option>
                  <option value="combined">Combined</option>
                  <option value="error">Error</option>
                </select>
                <button id="refreshList">Dateien aktualisieren</button>
              </div>
              <h3 style="font-size: 14px; color: #e2e8f0; margin-bottom: 8px">
                Dateien <span id="fileCount" class="file-count">0</span>
              </h3>
              <ul id="files" class="file-list"></ul>
            </div>
          </aside>
          <section class="log-area">
            <div class="log-top">
              <div id="currentFile" class="current-file">Live tail</div>
              <label style="font-size: 14px; color: #cbd5e1"
                ><input type="checkbox" id="autoscroll" checked />
                Autoscroll</label
              >
              <div style="flex: 1"></div>
              <form method="POST" action="/admin/logout">
                <button type="submit" class="logout-btn">Logout</button>
              </form>
            </div>
            <div id="logOutput" class="log-output"></div>
          </section>
        </div>
      </main>
      <footer>
        <p>Admin Log Viewer</p>
      </footer>
    </div>
    <script>
      const filesEl = document.getElementById('files');
      const fileCountEl = document.getElementById('fileCount');
      const logOutput = document.getElementById('logOutput');
      const logTypeSel = document.getElementById('logType');
      const currentFileEl = document.getElementById('currentFile');
      const autoscrollEl = document.getElementById('autoscroll');
      const refreshBtn = document.getElementById('refreshList');

      let evtSource = null;

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      async function loadFiles() {
        const type = logTypeSel.value;
        const res = await fetch(
          `/admin/logs/list?type=${encodeURIComponent(type)}`
        );
        if (!res.ok) {
          filesEl.innerHTML = '<li>Failed to load files</li>';
          return;
        }
        const data = await res.json();
        fileCountEl.textContent = String(data.files.length);
        filesEl.innerHTML = '';
        for (const f of data.files) {
          const li = document.createElement('li');
          li.className = 'file-item';
          const name = document.createElement('div');
          name.className = 'file-name';
          name.textContent = `${f.name} (${formatSize(f.size)})`;
          const actions = document.createElement('div');
          actions.className = 'file-actions';
          const viewBtn = document.createElement('button');
          viewBtn.textContent = 'Ansehen';
          viewBtn.onclick = () => viewFile(f.name);
          const dlBtn = document.createElement('button');
          dlBtn.textContent = 'Download';
          dlBtn.onclick = () =>
            window.open(
              `/admin/logs/file?type=${encodeURIComponent(type)}&name=${encodeURIComponent(f.name)}&raw=1`,
              '_blank'
            );
          actions.appendChild(viewBtn);
          actions.appendChild(dlBtn);
          li.appendChild(name);
          li.appendChild(actions);
          filesEl.appendChild(li);
        }
      }

      function startSSE() {
        const type = logTypeSel.value;
        if (evtSource) evtSource.close();
        logOutput.textContent = '';
        currentFileEl.textContent = 'Live tail';
        evtSource = new EventSource(
          `/admin/logs/sse?type=${encodeURIComponent(type)}`
        );
        evtSource.onmessage = ev => {
          logOutput.textContent += ev.data + '\n';
          if (autoscrollEl.checked) {
            // Append line and scroll
            logOutput.scrollTop = logOutput.scrollHeight;
          }
        };
        evtSource.onerror = () => {
          // Do not clear or restart manually. EventSource auto-reconnects.
          // Keeping the content avoids jumping to top/end on transient drops.
        };
      }

      async function viewFile(name) {
        const type = logTypeSel.value;
        if (evtSource) {
          evtSource.close();
          evtSource = null;
        }
        currentFileEl.textContent = name;
        logOutput.textContent = 'Lade...';
        const res = await fetch(
          `/admin/logs/file?type=${encodeURIComponent(type)}&name=${encodeURIComponent(name)}`
        );
        if (!res.ok) {
          logOutput.textContent = 'Failed to load file';
          return;
        }
        const text = await res.text();
        logOutput.textContent = text;
        if (autoscrollEl.checked) logOutput.scrollTop = logOutput.scrollHeight;
      }

      logTypeSel.addEventListener('change', () => {
        startSSE();
        loadFiles();
      });
      refreshBtn.addEventListener('click', () => loadFiles());

      // init
      startSSE();
      loadFiles();
    </script>
  </body>
</html>
